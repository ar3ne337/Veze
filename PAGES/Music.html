<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fullscreen Music Player with Album Art</title>

    <!-- Import Font Awesome icons from CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Import Google Fonts from CDN -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

    <style>
        :root {
            --bg: #000000;
            --surface: #0d0d0d;
            --surface-light: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --gradient-start: #a855f7;
            --gradient-mid: #6366f1;
            --gradient-end: #3b82f6;
            --accent: #a855f7;
            --progress-height: 6px;
            --thumb-size: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============ MAIN PLAYER CONTAINER (FULLSCREEN) ============ */
        .music-player {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 28px 40px;
            z-index: 1;
            transition: all 0.3s ease;
        }

        /* ============ HEADER ============ */
        .player-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            position: absolute;
            top: 16px;
            left: 0;
            padding: 0 28px;
            z-index: 5;
        }

        .now-playing-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #777;
            font-weight: 500;
        }

        /* List icon button - top right */
        .list-toggle-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.4rem;
            cursor: pointer;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            position: relative;
            z-index: 10;
        }

        .list-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .list-toggle-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.14);
        }

        /* ============ ALBUM ART SQUARE ============ */
        .album-art-container {
            width: 250px;
            height: 250px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background: #0a0a0a;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.1), inset 0 0 40px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            flex-shrink: 0;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .album-art-container.playing {
            border-color: rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.2), 0 0 100px rgba(99, 102, 241, 0.1), inset 0 0 40px rgba(0, 0, 0, 0.5);
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%,
            100% {
                box-shadow: 0 0 60px rgba(168, 85, 247, 0.2), 0 0 100px rgba(99, 102, 241, 0.1), inset 0 0 40px rgba(0, 0, 0, 0.5);
            }
            50% {
                box-shadow: 0 0 80px rgba(168, 85, 247, 0.35), 0 0 130px rgba(99, 102, 241, 0.2), inset 0 0 40px rgba(0, 0, 0, 0.5);
            }
        }

        .album-art-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }

        .album-art-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            z-index: 1;
            pointer-events: none;
        }

        .album-art-fallback i {
            font-size: 70px;
            color: rgba(255, 255, 255, 0.2);
            transition: color 0.3s ease;
        }

        .album-art-container.playing .album-art-fallback i {
            color: rgba(168, 85, 247, 0.3);
        }

        /* Hide fallback when image is loaded */
        .album-art-container.image-loaded .album-art-fallback {
            opacity: 0;
        }

        /* ============ SONG INFO ============ */
        .song-info {
            text-align: center;
            width: 100%;
            margin-bottom: 10px;
            min-height: 60px;
            max-width: 600px;
        }

        .song-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            line-height: 1.3;
        }

        .song-artist {
            font-size: 0.9rem;
            font-weight: 400;
            color: #888;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* ============ PROGRESS BAR ============ */
        .progress-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 15px 0 5px;
        }

        .progress-container {
            position: relative;
            width: 100%;
            height: var(--progress-height);
            background: #1e1e1e;
            border-radius: 10px;
            cursor: pointer;
            overflow: visible;
            transition: height 0.2s ease;
        }

        .progress-container:hover {
            height: 8px;
        }

        .progress-container:active {
            height: 8px;
        }

        /* The filled portion with gradient */
        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(to right,
                    #a855f7,
                    #8b5cf6,
                    #6366f1,
                    #4f46e5,
                    #3b82f6);
            background-size: 200% 100%;
            animation: gradientShift 3s ease infinite;
            transition: width 0.1s linear;
            pointer-events: none;
            z-index: 1;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* The draggable thumb */
        .progress-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            width: var(--thumb-size);
            height: var(--thumb-size);
            background: #ffffff;
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, left 0.1s linear;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(168, 85, 247, 0.5);
        }

        .progress-container:hover .progress-thumb,
        .progress-container:active .progress-thumb,
        .progress-container.dragging .progress-thumb {
            opacity: 1;
        }

        /* Time display */
        .time-display {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.78rem;
            font-weight: 500;
            color: #666;
            letter-spacing: 0.5px;
            max-width: 600px;
        }

        .time-current,
        .time-total {
            font-variant-numeric: tabular-nums;
            font-family: 'Poppins', monospace;
        }

        /* ============ CONTROLS ============ */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 18px;
            width: 100%;
            max-width: 500px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
            position: relative;
        }

        .ctrl-btn:hover {
            color: #ffffff;
            transform: scale(1.08);
        }

        .ctrl-btn:active {
            transform: scale(0.88);
            transition: all 0.1s ease;
        }

        /* Previous & Next */
        .btn-prev,
        .btn-next {
            width: 48px;
            height: 48px;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.04);
        }

        .btn-prev:hover,
        .btn-next:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Play/Pause - larger */
        .btn-play-pause {
            width: 68px;
            height: 68px;
            font-size: 1.5rem;
            background: #ffffff;
            color: #000000;
            box-shadow: 0 10px 35px rgba(168, 85, 247, 0.4);
            transition: all 0.25s ease;
        }

        .btn-play-pause:hover {
            transform: scale(1.06);
            box-shadow: 0 14px 45px rgba(168, 85, 247, 0.55);
            color: #000000;
        }

        .btn-play-pause:active {
            transform: scale(0.9);
            transition: all 0.1s ease;
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.35);
        }

        /* Repeat button */
        .btn-repeat {
            width: 48px;
            height: 48px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.04);
        }

        .btn-repeat:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-repeat.active {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.12);
        }

        .btn-repeat.repeat-one {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.12);
        }

        /* Small "1" badge for repeat-one */
        .repeat-one-badge {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 0.6rem;
            font-weight: 700;
            color: #a855f7;
            display: none;
            pointer-events: none;
        }

        .btn-repeat.repeat-one .repeat-one-badge {
            display: block;
        }

        /* Shuffle button */
        .btn-shuffle {
            width: 48px;
            height: 48px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.04);
        }

        .btn-shuffle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-shuffle.active {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.12);
        }

        /* ============ PLAYLIST OVERLAY PANEL ============ */
        .playlist-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .playlist-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .playlist-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 420px;
            height: 100%;
            background: #0a0a0a;
            z-index: 60;
            display: flex;
            flex-direction: column;
            transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        .playlist-panel.open {
            right: 0;
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 20px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .playlist-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .playlist-close-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.3rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .playlist-close-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .playlist-count {
            font-size: 0.8rem;
            color: #666;
            font-weight: 400;
            margin-left: 6px;
        }

        .playlist-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            list-style: none;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }

        .playlist-list::-webkit-scrollbar {
            width: 4px;
        }

        .playlist-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlist-list::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 4px;
            position: relative;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .playlist-item.active {
            background: rgba(168, 85, 247, 0.1);
        }

        .playlist-item.active .playlist-item-title {
            color: #a855f7;
        }

        .playlist-item-number {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .playlist-item.active .playlist-item-number {
            color: #a855f7;
        }

        .playlist-item-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s ease;
        }

        .playlist-item-artist {
            font-size: 0.75rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item.active .playlist-item-artist {
            color: #888;
        }

        .playlist-item-playing-icon {
            font-size: 0.75rem;
            color: #a855f7;
            display: none;
            animation: pulseDot 1s ease-in-out infinite;
        }

        .playlist-item.active .playlist-item-playing-icon {
            display: block;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ============ RESPONSIVE ADJUSTMENTS ============ */
        @media (max-width: 600px) {
            .music-player {
                padding: 20px 20px 32px;
            }

            .player-header {
                padding: 0 20px;
            }

            .album-art-container {
                width: 200px;
                height: 200px;
            }

            .btn-play-pause {
                width: 60px;
                height: 60px;
                font-size: 1.3rem;
            }

            .btn-prev,
            .btn-next,
            .btn-repeat,
            .btn-shuffle {
                width: 44px;
                height: 44px;
                font-size: 1rem;
            }

            .controls {
                gap: 12px;
            }

            .song-title {
                font-size: 1.2rem;
            }

            .playlist-panel {
                width: 90%;
            }
        }

        @media (max-width: 400px) {
            .album-art-container {
                width: 160px;
                height: 160px;
            }

            .btn-play-pause {
                width: 54px;
                height: 54px;
                font-size: 1.1rem;
            }

            .btn-prev,
            .btn-next,
            .btn-repeat,
            .btn-shuffle {
                width: 40px;
                height: 40px;
                font-size: 0.9rem;
            }

            .controls {
                gap: 8px;
            }

            .song-title {
                font-size: 1.1rem;
            }

            .album-art-fallback i {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== MUSIC PLAYER (FULLSCREEN) ==================== -->
    <div class="music-player" id="musicPlayer">
        <!-- Header with list icon -->
        <div class="player-header">
            <span class="now-playing-label">Now Playing</span>
            <button class="list-toggle-btn" id="listToggleBtn" title="Playlist" aria-label="Open playlist">
                <i class="fa-solid fa-list"></i>
            </button>
        </div>

        <!-- Album Art Square -->
        <div class="album-art-container" id="albumArtContainer">
            <img class="album-art-image" id="albumArtImage" src="" alt="Album Art" style="display: none;">
            <div class="album-art-fallback" id="albumArtFallback">
                <i class="fa-solid fa-music"></i>
            </div>
        </div>

        <!-- Song Info -->
        <div class="song-info">
            <div class="song-title" id="songTitle">Select a Track</div>
            <div class="song-artist" id="songArtist">Press play to begin</div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-wrapper">
            <div class="progress-container" id="progressContainer">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-thumb" id="progressThumb"></div>
            </div>
            <div class="time-display">
                <span class="time-current" id="timeCurrent">00:00</span>
                <span class="time-total" id="timeTotal">00:00</span>
            </div>
        </div>

        <!-- Controls (Shuffle on left) -->
        <div class="controls">
            <!-- Shuffle (left side) -->
            <button class="ctrl-btn btn-shuffle" id="btnShuffle" title="Shuffle: Off" aria-label="Shuffle mode">
                <i class="fa-solid fa-shuffle"></i>
            </button>

            <!-- Previous -->
            <button class="ctrl-btn btn-prev" id="btnPrev" title="Previous" aria-label="Previous track">
                <i class="fa-solid fa-backward-step"></i>
            </button>

            <!-- Play/Pause -->
            <button class="ctrl-btn btn-play-pause" id="btnPlayPause" title="Play" aria-label="Play">
                <i class="fa-solid fa-play" id="playPauseIcon"></i>
            </button>

            <!-- Next -->
            <button class="ctrl-btn btn-next" id="btnNext" title="Next" aria-label="Next track">
                <i class="fa-solid fa-forward-step"></i>
            </button>

            <!-- Repeat -->
            <button class="ctrl-btn btn-repeat" id="btnRepeat" title="Repeat: Off" aria-label="Repeat mode">
                <i class="fa-solid fa-repeat"></i>
                <span class="repeat-one-badge">1</span>
            </button>
        </div>
    </div>

    <!-- ==================== PLAYLIST OVERLAY ==================== -->
    <div class="playlist-overlay" id="playlistOverlay"></div>

    <div class="playlist-panel" id="playlistPanel">
        <div class="playlist-header">
            <div>
                <span class="playlist-title">Playlist</span>
                <span class="playlist-count" id="playlistCount">5 tracks</span>
            </div>
            <button class="playlist-close-btn" id="playlistCloseBtn" aria-label="Close playlist">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <ul class="playlist-list" id="playlistList">
            <!-- Playlist items injected by JS -->
        </ul>
    </div>

    <!-- ==================== AUDIO ELEMENT ==================== -->
    <audio id="audioElement" preload="metadata"></audio>

            // ==================== STATE ====================
            let currentTrackIndex = 0;
            let isPlaying = false;
            let repeatMode = 0; // 0 = off, 1 = repeat all, 2 = repeat one
            let isShuffled = false;
            let isDragging = false;
            let audioLoaded = false;

            // Shuffle order management
            let shuffleOrder = [];
            let shufflePosition = 0;

            // ==================== FUNCTIONS ====================
            function formatTime(seconds) {
                if (isNaN(seconds) || seconds < 0 || !isFinite(seconds)) return '00:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            }

            function updateProgressUI() {
                const duration = audio.duration;
                const currentTime = audio.currentTime;

                if (isNaN(duration) || duration <= 0) {
                    progressFill.style.width = '0%';
                    progressThumb.style.left = '0%';
                    timeCurrent.textContent = '00:00';
                    timeTotal.textContent = '00:00';
                    return;
                }

                const progressPercent = (currentTime / duration) * 100;
                progressFill.style.width = progressPercent + '%';
                progressThumb.style.left = progressPercent + '%';
                timeCurrent.textContent = formatTime(currentTime);
                timeTotal.textContent = formatTime(duration);
            }

            function loadAlbumArt(track) {
                albumArtContainer.classList.remove('image-loaded');
                if (track.image && track.image.trim() !== '') {
                    albumArtImage.src = track.image;
                    albumArtImage.style.display = 'block';
                    albumArtImage.onload = () => {
                        albumArtContainer.classList.add('image-loaded');
                    };
                    albumArtImage.onerror = () => {
                        // Fallback
                        albumArtImage.style.display = 'none';
                        albumArtContainer.classList.remove('image-loaded');
                    };
                } else {
                    albumArtImage.style.display = 'none';
                    albumArtContainer.classList.remove('image-loaded');
                }
            }

            function loadTrack(index) {
                if (index < 0 || index >= playlist.length) return;
                currentTrackIndex = index;
                audioLoaded = false;
                const track = playlist[index];

                songTitle.textContent = track.title;
                songArtist.textContent = track.artist;
                progressFill.style.width = '0%';
                progressThumb.style.left = '0%';
                timeCurrent.textContent = '00:00';
                timeTotal.textContent = '00:00';

                loadAlbumArt(track);

                audio.src = track.url;
                audio.load();

                updatePlaylistHighlight();

                if (!isPlaying) {
                    albumArtContainer.classList.remove('playing');
                }

                if (isShuffled && shuffleOrder.length > 0) {
                    const pos = shuffleOrder.indexOf(currentTrackIndex);
                    if (pos !== -1) {
                        shufflePosition = pos;
                    } else {
                        generateShuffleOrder();
                        shufflePosition = shuffleOrder.indexOf(currentTrackIndex);
                        if (shufflePosition === -1) shufflePosition = 0;
                    }
                }
            }

            function playTrack(index) {
                if (index !== currentTrackIndex || !audioLoaded && index === currentTrackIndex) {
                    loadTrack(index);
                }
                play();
            }

            function play() {
                const promise = audio.play();
                if (promise !== undefined) {
                    promise.then(() => {
                        setIsPlayingState(true);
                    }).catch((err) => {
                        console.warn('Playback prevented:', err.message);
                        setIsPlayingState(false);
                    });
                }
            }

            function pause() {
                audio.pause();
                setIsPlayingState(false);
            }

            function togglePlayPause() {
                if (isPlaying) {
                    pause();
                } else {
                    if (!audio.src || audio.src === window.location.href) {
                        loadTrack(currentTrackIndex);
                    }
                    play();
                }
            }

            function setIsPlayingState(state) {
                isPlaying = state;
                if (state) {
                    playPauseIcon.className = 'fa-solid fa-pause';
                    btnPlayPause.setAttribute('aria-label', 'Pause');
                    btnPlayPause.title = 'Pause';
                    albumArtContainer.classList.add('playing');
                } else {
                    playPauseIcon.className = 'fa-solid fa-play';
                    btnPlayPause.setAttribute('aria-label', 'Play');
                    btnPlayPause.title = 'Play';
                    albumArtContainer.classList.remove('playing');
                }
                updatePlaylistHighlight();
            }

            // Shuffle logic
            function generateShuffleOrder() {
                const allIndices = [...Array(playlist.length).keys()];
                for (let i = allIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allIndices[i], allIndices[j]] = [allIndices[j], allIndices[i]];
                }
                return allIndices;
            }

            function enableShuffle() {
                if (playlist.length === 0) return;
                isShuffled = true;
                const otherIndices = [];
                for (let i = 0; i < playlist.length; i++) {
                    if (i !== currentTrackIndex) otherIndices.push(i);
                }
                for (let i = otherIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [otherIndices[i], otherIndices[j]] = [otherIndices[j], otherIndices[i]];
                }
                shuffleOrder = [currentTrackIndex, ...otherIndices];
                shufflePosition = 0;
                btnShuffle.classList.add('active');
                btnShuffle.title = 'Shuffle: On';
                btnShuffle.setAttribute('aria-label', 'Shuffle: On');
            }

            function disableShuffle() {
                isShuffled = false;
                shuffleOrder = [];
                shufflePosition = 0;
                btnShuffle.classList.remove('active');
                btnShuffle.title = 'Shuffle: Off';
                btnShuffle.setAttribute('aria-label', 'Shuffle: Off');
            }

            function toggleShuffle() {
                if (isShuffled) {
                    disableShuffle();
                } else {
                    enableShuffle();
                }
            }

            function getNextTrackIndex() {
                if (isShuffled && shuffleOrder.length > 0) {
                    let nextPos = shufflePosition + 1;
                    if (nextPos >= shuffleOrder.length) {
                        if (repeatMode === 1) {
                            const newOrder = generateShuffleOrder();
                            shuffleOrder = newOrder;
                            shufflePosition = 0;
                            return shuffleOrder[0];
                        } else if (repeatMode === 2) {
                            return currentTrackIndex;
                        } else {
                            const newOrder = generateShuffleOrder();
                            shuffleOrder = newOrder;
                            shufflePosition = 0;
                            return shuffleOrder[0];
                        }
                    } else {
                        shufflePosition = nextPos;
                        return shuffleOrder[shufflePosition];
                    }
                } else {
                    let nextIndex = currentTrackIndex + 1;
                    if (nextIndex >= playlist.length) {
                        nextIndex = 0;
                    }
                    return nextIndex;
                }
            }

            function getPrevTrackIndex() {
                if (isShuffled && shuffleOrder.length > 0) {
                    let prevPos = shufflePosition - 1;
                    if (prevPos < 0) {
                        prevPos = shuffleOrder.length - 1;
                    }
                    shufflePosition = prevPos;
                    return shuffleOrder[shufflePosition];
                } else {
                    let prevIndex = currentTrackIndex - 1;
                    if (prevIndex < 0) {
                        prevIndex = playlist.length - 1;
                    }
                    return prevIndex;
                }
            }

            function nextTrack() {
                if (playlist.length === 0) return;
                const nextIdx = getNextTrackIndex();
                playTrack(nextIdx);
            }

            function prevTrack() {
                if (playlist.length === 0) return;
                if (audio.currentTime > 3) {
                    audio.currentTime = 0;
                    if (!isPlaying) play();
                    return;
                }
                const prevIdx = getPrevTrackIndex();
                playTrack(prevIdx);
            }

            function cycleRepeatMode() {
                repeatMode = (repeatMode + 1) % 3;
                updateRepeatButtonUI();
            }

            function updateRepeatButtonUI() {
                btnRepeat.classList.remove('active', 'repeat-one');
                switch (repeatMode) {
                    case 0:
                        btnRepeat.title = 'Repeat: Off';
                        btnRepeat.setAttribute('aria-label', 'Repeat: Off');
                        break;
                    case 1:
                        btnRepeat.classList.add('active');
                        btnRepeat.title = 'Repeat: All';
                        btnRepeat.setAttribute('aria-label', 'Repeat: All');
                        break;
                    case 2:
                        btnRepeat.classList.add('repeat-one');
                        btnRepeat.title = 'Repeat: One';
                        btnRepeat.setAttribute('aria-label', 'Repeat: One');
                        break;
                }
            }

            function seekToPosition(clientX) {
                const rect = progressContainer.getBoundingClientRect();
                let clickX = clientX - rect.left;
                clickX = Math.max(0, Math.min(clickX, rect.width));
                const percent = clickX / rect.width;
                if (!isNaN(audio.duration) && audio.duration > 0) {
                    audio.currentTime = percent * audio.duration;
                }
                updateProgressUI();
            }

            // ==================== PLAYLIST UI ====================
            function renderPlaylist() {
                playlistList.innerHTML = '';
                playlist.forEach((track, index) => {
                    const li = document.createElement('li');
                    li.className = 'playlist-item';
                    if (index === currentTrackIndex && isPlaying) {
                        li.classList.add('active');
                    }
                    li.innerHTML = `
                            <span class="playlist-item-number">${String(index + 1).padStart(2, '0')}</span>
                            <div class="playlist-item-info">
                                <div class="playlist-item-title">${track.title}</div>
                                <div class="playlist-item-artist">${track.artist}</div>
                            </div>
                            <span class="playlist-item-playing-icon">
                                <i class="fa-solid fa-volume-high"></i>
                            </span>
                        `;
                    li.addEventListener('click', () => {
                        playTrack(index);
                        closePlaylist();
                    });
                    playlistList.appendChild(li);
                });
                playlistCount.textContent = playlist.length + ' track' + (playlist.length !== 1 ? 's' : '');
            }

            function updatePlaylistHighlight() {
                const items = playlistList.querySelectorAll('.playlist-item');
                items.forEach((item, index) => {
                    if (index === currentTrackIndex && isPlaying) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }

            function openPlaylist() {
                playlistPanel.classList.add('open');
                playlistOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
                renderPlaylist();
            }

            function closePlaylist() {
                playlistPanel.classList.remove('open');
                playlistOverlay.classList.remove('open');
                document.body.style.overflow = '';
            }

            // ==================== EVENT LISTENERS ====================
            btnPlayPause.addEventListener('click', togglePlayPause);
            btnNext.addEventListener('click', nextTrack);
            btnPrev.addEventListener('click', prevTrack);
            btnRepeat.addEventListener('click', cycleRepeatMode);
            btnShuffle.addEventListener('click', toggleShuffle);
            listToggleBtn.addEventListener('click', openPlaylist);
            playlistCloseBtn.addEventListener('click', closePlaylist);
            playlistOverlay.addEventListener('click', closePlaylist);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && playlistPanel.classList.contains('open')) {
                    closePlaylist();
                }
                if (e.key === ' ' && !playlistPanel.classList.contains('open') &&
                    document.activeElement === document.body) {
                    e.preventDefault();
                    togglePlayPause();
                }
                if (e.key === 'ArrowRight' && !playlistPanel.classList.contains('open') &&
                    document.activeElement === document.body) {
                    e.preventDefault();
                    nextTrack();
                }
                if (e.key === 'ArrowLeft' && !playlistPanel.classList.contains('open') &&
                    document.activeElement === document.body) {
                    e.preventDefault();
                    prevTrack();
                }
                if (e.key === 's' && !playlistPanel.classList.contains('open') &&
                    document.activeElement === document.body) {
                    e.preventDefault();
                    toggleShuffle();
                }
            });

            progressContainer.addEventListener('click', (e) => {
                if (isDragging) return;
                seekToPosition(e.clientX);
            });

            progressContainer.addEventListener('mousedown', (e) => {
                isDragging = true;
                progressContainer.classList.add('dragging');
                seekToPosition(e.clientX);

                const onMouseMove = (moveEvent) => {
                    seekToPosition(moveEvent.clientX);
                };
                const onMouseUp = () => {
                    isDragging = false;
                    progressContainer.classList.remove('dragging');
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            progressContainer.addEventListener('touchstart', (e) => {
                isDragging = true;
                progressContainer.classList.add('dragging');
                seekToPosition(e.touches[0].clientX);

                const onTouchMove = (moveEvent) => {
                    seekToPosition(moveEvent.touches[0].clientX);
                };
                const onTouchEnd = () => {
                    isDragging = false;
                    progressContainer.classList.remove('dragging');
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };
                document.addEventListener('touchmove', onTouchMove, { passive: true });
                document.addEventListener('touchend', onTouchEnd);
            });

            audio.addEventListener('timeupdate', () => {
                if (!isDragging) {
                    updateProgressUI();
                }
            });

            audio.addEventListener('loadedmetadata', () => {
                audioLoaded = true;
                updateProgressUI();
            });

            audio.addEventListener('loadeddata', () => {
                audioLoaded = true;
                updateProgressUI();
            });

            audio.addEventListener('canplay', () => {
                audioLoaded = true;
                updateProgressUI();
            });

            audio.addEventListener('play', () => {
                setIsPlayingState(true);
            });

            audio.addEventListener('pause', () => {
                setIsPlayingState(false);
            });

            audio.addEventListener('ended', () => {
                if (repeatMode === 2) {
                    audio.currentTime = 0;
                    play();
                } else if (repeatMode === 1) {
                    nextTrack();
                } else {
                    if (currentTrackIndex < playlist.length - 1 || isShuffled) {
                        nextTrack();
                    } else {
                        loadTrack(0);
                        setIsPlayingState(false);
                        updateProgressUI();
                    }
                }
            });

            audio.addEventListener('error', () => {
                console.warn('Audio failed to load for track:', playlist[currentTrackIndex]?.title);
                audioLoaded = false;
                setIsPlayingState(false);
                timeTotal.textContent = '--:--';
                timeCurrent.textContent = '00:00';
                progressFill.style.width = '0%';
                progressThumb.style.left = '0%';
                if (isPlaying) {
                    setTimeout(() => {
                        if (currentTrackIndex < playlist.length - 1 || isShuffled) {
                            nextTrack();
                        }
                    }, 1500);
                }
            });

            // ==================== INITIALIZATION ====================
            function init() {
                renderPlaylist();
                updateRepeatButtonUI();
                disableShuffle();
                loadTrack(0);
                updateProgressUI();
                setIsPlayingState(false);
                audio.load();
            }

            init();

            console.log('🎵 Fullscreen Music Player with Album Art Ready');
            console.log('   Controls: Play/Pause | Prev | Next | Repeat | Shuffle');
            console.log('   List icon top-right for playlist');
            console.log('   Drag progress bar to seek');
            console.log('   Keyboard: Space=Play/Pause, Arrows=Prev/Next, S=Toggle Shuffle, Esc=Close playlist');
        })();
    </script>
</body>
</html>
